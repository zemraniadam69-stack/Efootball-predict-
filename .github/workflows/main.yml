        package com.pax.injector.data
        data class ScreenPoint(val x: Float, val y: Float) {
            fun distanceTo(o: ScreenPoint): Float = kotlin.math.sqrt((x - o.x) * (x - o.x) + (y - o.y) * (y - o.y))
        }
        data class OverlayState(val cueBall: ScreenPoint? = null, val targetBall: ScreenPoint? = null, val aimPoint: ScreenPoint? = null, val pocketPoint: ScreenPoint? = null)
        EOF

        cat << 'EOF' > app/src/main/java/com/pax/injector/engine/PhysicsEngine.kt
        package com.pax.injector.engine
        import com.pax.injector.data.*
        import kotlin.math.*

        object PhysicsEngine {
            fun calculateGhostBall(cue: ScreenPoint, target: ScreenPoint, pocket: ScreenPoint): ScreenPoint {
                val dx = pocket.x - target.x
                val dy = pocket.y - target.y
                val dist = sqrt(dx*dx + dy*dy)
                val nx = dx / dist
                val ny = dy / dist
                val ghostX = target.x - (nx * 30f)
                val ghostY = target.y - (ny * 30f)
                return ScreenPoint(ghostX, ghostY)
            }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/pax/injector/vision/VisionPipeline.kt
        package com.pax.injector.vision
        import android.graphics.Bitmap
        import android.graphics.Color
        import com.pax.injector.data.*
        import com.pax.injector.engine.PhysicsEngine
        import kotlinx.coroutines.flow.MutableStateFlow
        import org.opencv.android.Utils
        import org.opencv.core.*
        import org.opencv.imgproc.Imgproc

        object VisionPipeline {
            val overlayState = MutableStateFlow(OverlayState())
            private var isOpenCVLoaded = false

            fun init() {
                try {
                    System.loadLibrary("opencv_java4")
                    isOpenCVLoaded = true
                } catch (e: Exception) { e.printStackTrace() }
            }
            
            fun processFrame(bitmap: Bitmap) {
                if (!isOpenCVLoaded || ServiceState.showControlPanel.value) return

                val src = Mat()
                Utils.bitmapToMat(bitmap, src)
                
                val small = Mat()
                Imgproc.resize(src, small, Size(src.cols() / 2.0, src.rows() / 2.0))

                val gray = Mat()
                Imgproc.cvtColor(small, gray, Imgproc.COLOR_RGBA2GRAY)
                
                val circles = Mat()
                Imgproc.HoughCircles(gray, circles, Imgproc.HOUGH_GRADIENT, 1.0,
                    (small.rows() / 10).toDouble(), 100.0, 30.0, 10, 30)

                var cueBall: ScreenPoint? = null
                var targetBall: ScreenPoint? = null

                for (i in 0 until circles.cols()) {
                    val c = circles.get(0, i)
                    val x = c[0] * 2f
                    val y = c[1] * 2f
                    
                    val pixel = bitmap.getPixel(x.toInt().coerceIn(0, bitmap.width-1), y.toInt().coerceIn(0, bitmap.height-1))
                    val r = Color.red(pixel)
                    val g = Color.green(pixel)
                    val b = Color.blue(pixel)

                    if (r > 200 && g > 200 && b > 200 && cueBall == null) {
                        cueBall = ScreenPoint(x, y)
                    } else if (targetBall == null && (r < 200 || g < 200 || b < 200)) {
                        targetBall = ScreenPoint(x, y)
                    }
                }

                var aimPoint: ScreenPoint? = null
                var pocketPoint: ScreenPoint? = null

                if (cueBall != null && targetBall != null) {
                    // Find nearest pocket from Config
                    var minDist = Float.MAX_VALUE
                    for (p in Config.pockets) {
                        val pPoint = ScreenPoint(bitmap.width * p.x, bitmap.height * p.y)
                        val d = targetBall.distanceTo(pPoint)
                        if (d < minDist) {
                            minDist = d
                            pocketPoint = pPoint
                        }
                    }

                    if (pocketPoint != null) {
                        aimPoint = PhysicsEngine.calculateGhostBall(cueBall, targetBall, pocketPoint)
                    }
                }

                overlayState.value = OverlayState(cueBall, targetBall, aimPoint, pocketPoint)
                src.release(); small.release(); gray.release(); circles.release()
            }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/pax/injector/overlay/PitchOverlayView.kt
        package com.pax.injector.overlay
        import android.content.Context
        import android.graphics.*
        import android.view.View
        import com.pax.injector.vision.VisionPipeline
        class PitchOverlayView(context: Context) : View(context) {
            private val ballPaint = Paint().apply { color = Color.WHITE; style = Paint.Style.FILL }
            private val targetPaint = Paint().apply { color = Color.RED; style = Paint.Style.STROKE; strokeWidth = 4f }
            private val aimPaint = Paint().apply { 
                color = Color.CYAN
                strokeWidth = 8f
                style = Paint.Style.STROKE
                strokeCap = Paint.Cap.ROUND
                setShadowLayer(15f, 0f, 0f, Color.CYAN)
            }
            private val ghostPaint = Paint().apply { color = Color.CYAN; style = Paint.Style.STROKE; strokeWidth = 6f }
            
            private val handler = android.os.Handler(android.os.Looper.getMainLooper())
            private val runnable = object : Runnable { override fun run() { invalidate(); handler.postDelayed(this, 16) } }
            
            init { 
                setLayerType(LAYER_TYPE_SOFTWARE, null)
                handler.post(runnable) 
            }
            
            override fun onDraw(canvas: Canvas) {
                super.onDraw(canvas)
                val state = VisionPipeline.overlayState.value
                
                state.cueBall?.let { canvas.drawCircle(it.x, it.y, 15f, ballPaint) }
                state.targetBall?.let { canvas.drawCircle(it.x, it.y, 15f, targetPaint) }
                
                if (state.cueBall != null && state.aimPoint != null) {
                    canvas.drawLine(state.cueBall.x, state.cueBall.y, state.aimPoint.x, state.aimPoint.y, aimPaint)
                    canvas.drawCircle(state.aimPoint.x, state.aimPoint.y, 15f, ghostPaint)
                }
            }
        }
