        package com.efootball.visionassist.data
        data class ScreenPoint(val x: Float, val y: Float) {
            fun distanceTo(o: ScreenPoint): Float = kotlin.math.sqrt((x - o.x) * (x - o.x) + (y - o.y) * (y - o.y))
        }
        data class PitchPoint(val x: Float, val y: Float) { fun distanceTo(o: PitchPoint): Float = kotlin.math.sqrt((x - o.x) * (x - o.x) + (y - o.y) * (y - o.y)) }
        enum class PlayerRole { TEAMMATE, OPPONENT }
        data class DetectedBall(val screenPosition: ScreenPoint)
        data class DetectedPlayer(val screenPosition: ScreenPoint, val role: PlayerRole = PlayerRole.TEAMMATE)
        data class PassOption(val target: DetectedPlayer, val score: Float, val laneClearance: Float = 0f)
        data class OverlayState(val ball: DetectedBall? = null, val players: List<DetectedPlayer> = emptyList(), val opponents: List<DetectedPlayer> = emptyList(), val bestPass: PassOption? = null, val activePlayerCursor: ScreenPoint? = null)
        EOF

        cat << 'EOF' > app/src/main/java/com/efootball/visionassist/engine/PassEngine.kt
        package com.efootball.visionassist.engine
        import com.efootball.visionassist.data.*
        import kotlin.math.sqrt
        import kotlin.math.max
        import kotlin.math.min

        object PassEngine {
            fun rankPasses(from: ScreenPoint, teammates: List<DetectedPlayer>, opponents: List<DetectedPlayer>): List<PassOption> {
                if (teammates.isEmpty()) return emptyList()
                return teammates.mapIndexed { index, mate ->
                    val laneClearance = getLaneClearance(from, mate.screenPosition, opponents)
                    val distance = from.distanceTo(mate.screenPosition)
                    val safetyScore = if (laneClearance < 40f) laneClearance - 100f else laneClearance * 1.5f
                    val distanceScore = distance * 0.5f
                    val finalScore = safetyScore + distanceScore
                    PassOption(target = mate, score = finalScore, laneClearance = laneClearance)
                }.sortedByDescending { it.score }
            }

            private fun getLaneClearance(from: ScreenPoint, to: ScreenPoint, opponents: List<DetectedPlayer>): Float {
                if (opponents.isEmpty()) return 500f
                var minDist = 500f
                for (opp in opponents) {
                    val d = distancePointToSegment(opp.screenPosition, from, to)
                    if (d < minDist) minDist = d
                }
                return minDist
            }

            private fun distancePointToSegment(p: ScreenPoint, a: ScreenPoint, b: ScreenPoint): Float {
                val abx = b.x - a.x
                val aby = b.y - a.y
                val apx = p.x - a.x
                val apy = p.y - a.y
                val ab2 = abx * abx + aby * aby
                if (ab2 == 0f) return sqrt(apx * apx + apy * apy)
                var t = (apx * abx + apy * aby) / ab2
                t = max(0f, min(1f, t))
                val projX = a.x + abx * t
                val projY = a.y + aby * t
                return sqrt((p.x - projX) * (p.x - projX) + (p.y - projY) * (p.y - projY))
            }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/efootball/visionassist/vision/VisionPipeline.kt
        package com.efootball.visionassist.vision
        import android.graphics.Bitmap
        import android.graphics.Color
        import com.efootball.visionassist.data.*
        import com.efootball.visionassist.engine.PassEngine
        import kotlinx.coroutines.flow.MutableStateFlow
        import kotlin.math.abs

        object VisionPipeline {
            val overlayState = MutableStateFlow(OverlayState())
            fun init() {}
            
            fun processFrame(bitmap: Bitmap) {
                val scaled = Bitmap.createScaledBitmap(bitmap, bitmap.width / 4, bitmap.height / 4, false)
                val width = scaled.width
                val height = scaled.height
                val pixels = IntArray(width * height)
                scaled.getPixels(pixels, 0, width, 0, 0, width, height)

                var ball: DetectedBall? = null
                var cursor: ScreenPoint? = null
                val mates = mutableListOf<DetectedPlayer>()
                val opponents = mutableListOf<DetectedPlayer>()

                val minX = (width * 0.05).toInt()
                val maxX = (width * 0.75).toInt() 
                val minY = (height * 0.25).toInt() 
                val maxY = (height * 0.85).toInt()

                for (y in minY until maxY step 4) {
                    for (x in minX until maxX step 4) {
                        val p = pixels[y * width + x]
                        val r = Color.red(p)
                        val g = Color.green(p)
                        val b = Color.blue(p)

                        if (r < 100 && g > 180 && b > 180 && cursor == null) {
                            cursor = ScreenPoint(x * 4f, y * 4f)
                        }
                        if (r > 235 && g > 235 && b > 235 && ball == null) {
                            ball = DetectedBall(ScreenPoint(x * 4f, y * 4f))
                        }
                        if (r > 160 && g < 60 && b < 60) {
                            val pt = ScreenPoint(x * 4f, y * 4f)
                            if (mates.size < 11 && mates.none { abs(it.screenPosition.x - pt.x) < 100 && abs(it.screenPosition.y - pt.y) < 100 }) {
                                mates.add(DetectedPlayer(pt, PlayerRole.TEAMMATE))
                            }
                        }
                        if (r < 45 && g < 45 && b < 45) {
                            val pt = ScreenPoint(x * 4f, y * 4f)
                            if (opponents.size < 11 && opponents.none { abs(it.screenPosition.x - pt.x) < 100 && abs(it.screenPosition.y - pt.y) < 100 }) {
                                opponents.add(DetectedPlayer(pt, PlayerRole.OPPONENT))
                            }
                        }
                    }
                }

                var bestPass: PassOption? = null

                if (cursor != null && mates.isNotEmpty()) {
                    val otherMates = mates.filter { it.screenPosition.distanceTo(cursor) > 100f }
                    bestPass = PassEngine.rankPasses(cursor, otherMates, opponents).firstOrNull()
                    if (bestPass != null && bestPass.laneClearance < 40f) {
                        bestPass = PassEngine.rankPasses(cursor, otherMates, opponents).getOrNull(1)
                    }
                }

                overlayState.value = OverlayState(ball, mates, opponents, bestPass, cursor)
            }
        }
        EOF

