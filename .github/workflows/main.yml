name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Unzip Project
      run: unzip eFootball-Vision-Assist-Android.zip -d app_source
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Grant execute permission for gradlew
      run: cd app_source && chmod +x gradlew
      
    - name: Build Debug APK
      run: cd app_source && ./gradlew assembleDebug
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: eFootball-Assist-APK
        path: app_source/app/build/outputs/apk/debug/app-debug.apk
