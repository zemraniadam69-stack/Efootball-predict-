        package com.pax.injector.service
        import android.app.Service
        import android.content.Intent
        import android.graphics.PixelFormat
        import android.os.IBinder
        import android.view.Gravity
        import android.view.WindowManager
        import androidx.compose.ui.platform.ComposeView
        import com.pax.injector.data.ServiceState
        import com.pax.injector.overlay.ControlPanel
        import com.pax.injector.overlay.PitchOverlayView

        class OverlayService : Service() {
            private lateinit var windowManager: WindowManager
            private var overlayView: PitchOverlayView? = null
            private var controlPanel: ComposeView? = null

            override fun onCreate() {
                super.onCreate()
                windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                setupVisionOverlay()
                setupControlPanel()
                ServiceState.isRunning.value = true
            }

            private fun setupVisionOverlay() {
                overlayView = PitchOverlayView(this)
                val params = WindowManager.LayoutParams(
                    WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.MATCH_PARENT,
                    WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                    WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                    PixelFormat.TRANSLUCENT
                )
                params.gravity = Gravity.TOP or Gravity.START
                windowManager.addView(overlayView, params)
            }

            private fun setupControlPanel() {
                controlPanel = ComposeView(this).apply {
                    setContent {
                        ControlPanel(onClose = { stopServices() })
                    }
                }
                val params = WindowManager.LayoutParams(
                    WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT,
                    WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                    WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                    PixelFormat.TRANSLUCENT
                )
                params.gravity = Gravity.TOP or Gravity.START
                params.x = 50
                params.y = 150
                windowManager.addView(controlPanel, params)
            }

            private fun stopServices() {
                stopService(Intent(this, CaptureService::class.java))
                stopSelf()
            }

            override fun onDestroy() {
                super.onDestroy()
                overlayView?.let { windowManager.removeView(it) }
                controlPanel?.let { windowManager.removeView(it) }
                ServiceState.isRunning.value = false
            }
            override fun onBind(intent: Intent?): IBinder? = null
        }
        EOF

