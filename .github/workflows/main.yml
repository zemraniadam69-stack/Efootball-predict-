name: Build PAX-INJECTOR V2
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Unzip Project
      run: unzip eFootball-Vision-Assist-Android.zip -d app_source
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle 8.10.2
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.10.2
        
    - name: Clean Rebuild and Fix Everything
      run: |
        DIR=$(find app_source -name "settings.gradle*" -printf '%h\n' | head -n 1)
        cd "$DIR"
        
        echo "android.useAndroidX=true" >> gradle.properties
        echo "android.enableJetifier=false" >> gradle.properties
        echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m" >> gradle.properties
        
        rm -rf app/src/main/java/com/efootball/visionassist
        mkdir -p app/src/main/java/com/pax/injector/service
        mkdir -p app/src/main/java/com/pax/injector/overlay
        mkdir -p app/src/main/java/com/pax/injector/vision
        mkdir -p app/src/main/java/com/pax/injector/data
        mkdir -p app/src/main/java/com/pax/injector/engine
        mkdir -p app/src/main/res/drawable
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/layout
        
        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
            id("org.jetbrains.kotlin.plugin.compose")
        }
        android {
            namespace = "com.pax.injector"
            compileSdk = 34
            defaultConfig {
                applicationId = "com.pax.injector"
                minSdk = 26
                targetSdk = 34
                versionCode = 2
                versionName = "2.0"
            }
            buildFeatures { compose = true }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = "17" }
        }
        dependencies {
            implementation("androidx.core:core-ktx:1.12.0")
            implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
            implementation("androidx.activity:activity-compose:1.8.2")
            implementation(platform("androidx.compose:compose-bom:2023.08.00"))
            implementation("androidx.compose.ui:ui")
            implementation("androidx.compose.ui:ui-graphics")
            implementation("androidx.compose.ui:ui-tooling-preview")
            implementation("androidx.compose.material3:material3")
            implementation("androidx.compose.material:material-icons-extended")
            implementation("androidx.compose.foundation:foundation")
            implementation("org.opencv:opencv:4.10.0")
        }
        EOF

