        package com.efootball.visionassist.overlay
        import android.content.Context
        import android.graphics.*
        import android.view.View
        import com.efootball.visionassist.vision.VisionPipeline
        class PitchOverlayView(context: Context) : View(context) {
            private val ballPaint = Paint().apply { color = Color.WHITE; style = Paint.Style.FILL }
            
            // Professional Glowing Pass Line
            private val passPaint = Paint().apply { 
                color = Color.GREEN
                strokeWidth = 8f
                style = Paint.Style.STROKE
                strokeCap = Paint.Cap.ROUND
                setShadowLayer(15f, 0f, 0f, Color.GREEN) // Glow effect
            }
            
            // Target Dot
            private val targetPaint = Paint().apply {
                color = Color.GREEN
                style = Paint.Style.FILL
                setShadowLayer(10f, 0f, 0f, Color.GREEN)
            }
            
            private val handler = android.os.Handler(android.os.Looper.getMainLooper())
            private val runnable = object : Runnable { override fun run() { invalidate(); handler.postDelayed(this, 16) } }
            
            init { 
                setLayerType(LAYER_TYPE_SOFTWARE, null) // Required for shadows
                handler.post(runnable) 
            }
            
            override fun onDraw(canvas: Canvas) {
                super.onDraw(canvas)
                val state = VisionPipeline.overlayState.value
                
                state.ball?.let { canvas.drawCircle(it.screenPosition.x, it.screenPosition.y, 15f, ballPaint) }
                
                if (state.activePlayerCursor != null && state.bestPass != null) {
                    val cursor = state.activePlayerCursor
                    val target = state.bestPass.target.screenPosition
                    
                    // Draw Glowing Line
                    canvas.drawLine(cursor.x, cursor.y, target.x, target.y, passPaint)
                    
                    // Draw Target Circle
                    canvas.drawCircle(target.x, target.y, 20f, targetPaint)
                }
            }
        }
        EOF

        echo '<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24.0" android:viewportHeight="24.0"><path android:fillColor="#FF000000" android:pathData="M12,4.5C7,4.5 2.73,7.61 1,12c1.73,4.39 6,7.5 11,7.5s9.27,-3.11 11,-7.5c-1.73,-4.39 -6,-7.5 -11,-7.5zM12,17c-2.76,0 -5,-2.24 -5,-5s2.24,-5 5,-5 5,2.24 5,5 -2.24,5 -5,5zM12,9c-1.66,0 -3,1.34 -3,3s1.34,3 3,3 3,-1.34 3,-3 -1.34,-3 -3,-3z"/></vector>' > app/src/main/res/drawable/ic_vision_hud.xml

        gradle assembleDebug
        
