        package com.efootball.visionassist.service
        import android.app.Service
        import android.content.Intent
        import android.graphics.PixelFormat
        import android.os.IBinder
        import android.view.Gravity
        import android.view.LayoutInflater
        import android.view.MotionEvent
        import android.view.View
        import android.view.WindowManager
        import com.efootball.visionassist.R
        import com.efootball.visionassist.data.ServiceState
        import com.efootball.visionassist.overlay.PitchOverlayView

        class OverlayService : Service() {
            private lateinit var windowManager: WindowManager
            private var overlayView: PitchOverlayView? = null
            private var floatingButton: View? = null
            private lateinit var buttonParams: WindowManager.LayoutParams

            override fun onCreate() {
                super.onCreate()
                windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                setupOverlay()
                setupFloatingButton()
                ServiceState.isRunning.value = true
            }

            private fun setupOverlay() {
                overlayView = PitchOverlayView(this)
                val params = WindowManager.LayoutParams(
                    WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.MATCH_PARENT,
                    WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                    WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                    PixelFormat.TRANSLUCENT
                )
                params.gravity = Gravity.TOP or Gravity.START
                windowManager.addView(overlayView, params)
            }

            private fun setupFloatingButton() {
                val inflater = getSystemService(LAYOUT_INFLATER_SERVICE) as LayoutInflater
                floatingButton = inflater.inflate(R.layout.floating_button, null)

                buttonParams = WindowManager.LayoutParams(
                    200, 200,
                    WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                    WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                    PixelFormat.TRANSLUCENT
                )
                buttonParams.gravity = Gravity.TOP or Gravity.START
                buttonParams.x = 100
                buttonParams.y = 300

                floatingButton?.setOnTouchListener(object : View.OnTouchListener {
                    private var initialX = 0
                    private var initialY = 0
                    private var initialTouchX = 0f
                    private var initialTouchY = 0f

                    override fun onTouch(v: View?, event: MotionEvent?): Boolean {
                        when (event?.action) {
                            MotionEvent.ACTION_DOWN -> {
                                initialX = buttonParams.x
                                initialY = buttonParams.y
                                initialTouchX = event.rawX
                                initialTouchY = event.rawY
                                return true
                            }
                            MotionEvent.ACTION_MOVE -> {
                                buttonParams.x = initialX + (event.rawX - initialTouchX).toInt()
                                buttonParams.y = initialY + (event.rawY - initialTouchY).toInt()
                                windowManager.updateViewLayout(floatingButton, buttonParams)
                                return true
                            }
                            MotionEvent.ACTION_UP -> {
                                if (Math.abs(event.rawX - initialTouchX) < 10 && Math.abs(event.rawY - initialTouchY) < 10) {
                                    stopServices()
                                }
                                return true
                            }
                        }
                        return false
                    }
                })

                windowManager.addView(floatingButton, buttonParams)
            }

            private fun stopServices() {
                stopService(Intent(this, CaptureService::class.java))
                stopSelf()
            }

            override fun onDestroy() {
                super.onDestroy()
                overlayView?.let { windowManager.removeView(it) }
                floatingButton?.let { windowManager.removeView(it) }
                ServiceState.isRunning.value = false
            }
            override fun onBind(intent: Intent?): IBinder? = null
        }
        EOF

