name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Unzip Project
      run: unzip eFootball-Vision-Assist-Android.zip -d app_source
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle 8.10.2
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.10.2
        
    - name: Clean Rebuild and Fix Everything
      run: |
        DIR=$(find app_source -name "settings.gradle*" -printf '%h\n' | head -n 1)
        cd "$DIR"
        
        echo "android.useAndroidX=true" >> gradle.properties
        echo "android.enableJetifier=false" >> gradle.properties
        echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m" >> gradle.properties
        
        rm -rf app/src/main/java/com/efootball/visionassist
        mkdir -p app/src/main/java/com/efootball/visionassist/service
        mkdir -p app/src/main/java/com/efootball/visionassist/overlay
        mkdir -p app/src/main/java/com/efootball/visionassist/vision
        mkdir -p app/src/main/java/com/efootball/visionassist/data
        mkdir -p app/src/main/java/com/efootball/visionassist/engine
        mkdir -p app/src/main/res/drawable
        mkdir -p app/src/main/res/values
        
        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
            id("org.jetbrains.kotlin.plugin.compose")
        }
        android {
            namespace = "com.efootball.visionassist"
            compileSdk = 34
            defaultConfig {
                applicationId = "com.efootball.visionassist"
                minSdk = 26
                targetSdk = 34
                versionCode = 1
                versionName = "2.0"
            }
            buildFeatures { compose = true }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = "17" }
        }
        dependencies {
            implementation("androidx.core:core-ktx:1.12.0")
            implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
            implementation("androidx.activity:activity-compose:1.8.2")
            implementation(platform("androidx.compose:compose-bom:2023.08.00"))
            implementation("androidx.compose.ui:ui")
            implementation("androidx.compose.ui:ui-graphics")
            implementation("androidx.compose.ui:ui-tooling-preview")
            implementation("androidx.compose.material3:material3")
        }
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
            <application
                android:allowBackup="true"
                android:icon="@drawable/ic_vision_hud"
                android:label="eFootball Vision"
                android:theme="@style/Theme.App">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
                <service android:name=".service.CaptureService" android:foregroundServiceType="mediaProjection" />
                <service android:name=".service.OverlayService" />
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/res/values/themes.xml
        <resources>
            <style name="Theme.App" parent="android:Theme.Material.NoActionBar" />
        </resources>
        EOF

        cat << 'EOF' > app/src/main/java/com/efootball/visionassist/MainActivity.kt
        package com.efootball.visionassist
        import android.Manifest
        import android.content.Intent
        import android.media.projection.MediaProjectionManager
        import android.net.Uri
        import android.os.Build
        import android.os.Bundle
        import android.provider.Settings
        import androidx.activity.ComponentActivity
        import androidx.activity.compose.setContent
        import androidx.activity.result.contract.ActivityResultContracts
        import androidx.compose.foundation.background
        import androidx.compose.foundation.layout.*
        import androidx.compose.material3.*
        import androidx.compose.runtime.*
        import androidx.compose.ui.Alignment
        import androidx.compose.ui.Modifier
        import androidx.compose.ui.graphics.Color
        import androidx.compose.ui.unit.dp
        import com.efootball.visionassist.service.CaptureService
        import com.efootball.visionassist.service.OverlayService

        class MainActivity : ComponentActivity() {
            private var hasOverlay by mutableStateOf(false)
            private val notifPerm = registerForActivityResult(ActivityResultContracts.RequestPermission()) { }
            private val projectionLauncher = registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { result ->
                if (result.resultCode == RESULT_OK && result.data != null) {
                    val intent = Intent(this, CaptureService::class.java)
                    intent.putExtra("resultCode", result.resultCode)
                    intent.putExtra("data", result.data)
                    startForegroundService(intent)
                }
            }
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                    notifPerm.launch(Manifest.permission.POST_NOTIFICATIONS)
                }
                setContent {
                    MaterialTheme(colorScheme = darkColorScheme(primary = Color(0xFF10B981), background = Color(0xFF020617))) {
                        Column(
                            modifier = Modifier.fillMaxSize().background(Color(0xFF020617)).padding(16.dp),
                            horizontalAlignment = Alignment.CenterHorizontally,
                            verticalArrangement = Arrangement.Center
                        ) {
                            Text("eFootball Vision Assist v2", color = Color(0xFF34D399), style = MaterialTheme.typography.headlineMedium)
                            Spacer(modifier = Modifier.height(32.dp))
                            Button(onClick = {
                                if (!Settings.canDrawOverlays(this@MainActivity)) {
                                    startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                                } else {
                                    hasOverlay = true
                                    startService(Intent(this@MainActivity, OverlayService::class.java))
                                }
                            }) {
                                Text(if(hasOverlay) "Overlay Granted" else "1. Grant Overlay")
                            }
                            Spacer(modifier = Modifier.height(16.dp))
                            Button(onClick = {
                                val manager = getSystemService(MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                                projectionLauncher.launch(manager.createScreenCaptureIntent())
                            }) {
                                Text("2. Start Capture & Assist")
                            }
                        }
                    }
                }
            }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/efootball/visionassist/service/OverlayService.kt
        package com.efootball.visionassist.service
        import android.app.Service
        import android.content.Intent
        import android.graphics.PixelFormat
        import android.os.IBinder
        import android.view.Gravity
        import android.view.WindowManager
        import com.efootball.visionassist.overlay.PitchOverlayView

        class OverlayService : Service() {
            private lateinit var windowManager: WindowManager
            private var overlayView: PitchOverlayView? = null
            override fun onCreate() {
                super.onCreate()
                windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                overlayView = PitchOverlayView(this)
                val params = WindowManager.LayoutParams(
                    WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.MATCH_PARENT,
                    WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                    WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                    PixelFormat.TRANSLUCENT
                )
                params.gravity = Gravity.TOP or Gravity.START
                windowManager.addView(overlayView, params)
            }
            override fun onDestroy() { super.onDestroy(); overlayView?.let { windowManager.removeView(it) } }
            override fun onBind(intent: Intent?): IBinder? = null
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/efootball/visionassist/service/CaptureService.kt
        package com.efootball.visionassist.service
        import android.app.*
        import android.content.Intent
        import android.content.pm.ServiceInfo
        import android.graphics.Bitmap
        import android.graphics.PixelFormat
        import android.hardware.display.DisplayManager
        import android.hardware.display.VirtualDisplay
        import android.media.ImageReader
        import android.media.projection.MediaProjection
        import android.media.projection.MediaProjectionManager
        import android.os.Build
        import android.os.Handler
        import android.os.IBinder
        import android.os.Looper
        import android.util.DisplayMetrics
        import android.view.WindowManager
        import androidx.core.app.NotificationCompat
        import com.efootball.visionassist.R
        import com.efootball.visionassist.vision.VisionPipeline

        class CaptureService : Service() {
            private var mediaProjection: MediaProjection? = null
            private var virtualDisplay: VirtualDisplay? = null
            private var imageReader: ImageReader? = null
            
            override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    val channel = NotificationChannel("v_channel", "Vision", NotificationManager.IMPORTANCE_LOW)
                    (getSystemService(NOTIFICATION_SERVICE) as NotificationManager).createNotificationChannel(channel)
                }
                
                val notification = NotificationCompat.Builder(this, "v_channel").setContentTitle("Vision Running").setSmallIcon(R.drawable.ic_vision_hud).build()
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                    startForeground(1, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                } else {
                    startForeground(1, notification)
                }
                
                VisionPipeline.statusText.value = "Service Started..."
                
                val resultCode = intent?.getIntExtra("resultCode", 0) ?: 0
                val data = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                    intent?.getParcelableExtra("data", Intent::class.java)
                } else {
                    @Suppress("DEPRECATION")
                    intent?.getParcelableExtra("data")
                }
                
                if (data != null && mediaProjection == null) {
                    try {
                        val manager = getSystemService(MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                        mediaProjection = manager.getMediaProjection(resultCode, data)
                        
                        mediaProjection?.registerCallback(object : MediaProjection.Callback() {
                            override fun onStop() {
                                super.onStop()
                                virtualDisplay?.release()
                                imageReader?.close()
                                mediaProjection = null
                            }
                        }, Handler(Looper.getMainLooper()))
                        
                        VisionPipeline.statusText.value = "Projection Granted..."
                        setupVirtualDisplay()
                        VisionPipeline.init()
                    } catch (e: Exception) {
                        VisionPipeline.statusText.value = "Error: ${e.message}"
                    }
                }
                return START_STICKY
            }
            
            private fun setupVirtualDisplay() {
                val metrics = DisplayMetrics()
                val wm = getSystemService(WINDOW_SERVICE) as WindowManager
                wm.defaultDisplay.getRealMetrics(metrics)
                val width = metrics.widthPixels; val height = metrics.heightPixels; val density = metrics.densityDpi
                imageReader = ImageReader.newInstance(width, height, PixelFormat.RGBA_8888, 3)
                virtualDisplay = mediaProjection?.createVirtualDisplay("ScreenCapture", width, height, density, DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, imageReader?.surface, null, null)
                imageReader?.setOnImageAvailableListener({ reader ->
                    val image = reader.acquireLatestImage() ?: return@setOnImageAvailableListener
                    val planes = image.planes; val buffer = planes[0].buffer
                    val pixelStride = planes[0].pixelStride; val rowStride = planes[0].rowStride
                    val rowPadding = rowStride - pixelStride * width
                    val bitmap = Bitmap.createBitmap(width + rowPadding / pixelStride, height, Bitmap.Config.ARGB_8888)
                    bitmap.copyPixelsFromBuffer(buffer)
                    VisionPipeline.processFrame(Bitmap.createBitmap(bitmap, 0, 0, width, height))
                    image.close()
                }, null)
            }
            override fun onDestroy() { super.onDestroy(); virtualDisplay?.release(); imageReader?.close(); mediaProjection?.stop() }
            override fun onBind(intent: Intent?): IBinder? = null
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/efootball/visionassist/data/Models.kt
        package com.efootball.visionassist.data
        data class ScreenPoint(val x: Float, val y: Float)
        data class PitchPoint(val x: Float, val y: Float) { fun distanceTo(o: PitchPoint): Float = kotlin.math.sqrt((x - o.x) * (x - o.x) + (y - o.y) * (y - o.y)) }
        enum class PlayerRole { TEAMMATE, OPPONENT }
        data class DetectedBall(val screenPosition: ScreenPoint, val pitchPosition: PitchPoint = PitchPoint(0f, 0f))
        data class DetectedPlayer(val screenPosition: ScreenPoint, val pitchPosition: PitchPoint = PitchPoint(0f, 0f), val role: PlayerRole = PlayerRole.TEAMMATE, val number: Int = 0)
        data class PassOption(val target: DetectedPlayer, val score: Float, val laneClearance: Float = 0f, val forwardProgress: Float = 0f, val interceptionRisk: Float = 0f, val rank: Int = 0)
        data class OverlayState(val ball: DetectedBall? = null, val players: List<DetectedPlayer> = emptyList(), val bestPass: PassOption? = null)
        data class AssistSettings(val showOpponents: Boolean = true, val showRadar: Boolean = true, val showPassLines: Boolean = true, val lineThickness: Float = 4f)
        EOF

        cat << 'EOF' > app/src/main/java/com/efootball/visionassist/engine/PassEngine.kt
        package com.efootball.visionassist.engine
        import com.efootball.visionassist.data.*
        object PassEngine {
            fun rankPasses(ball: DetectedBall, teammates: List<DetectedPlayer>, opponents: List<DetectedPlayer>, goalX: Float = 105f): List<PassOption> {
                if (teammates.isEmpty()) return emptyList()
                return teammates.mapIndexed { index, mate ->
                    val laneClearance = opponents.minOfOrNull { opp -> mate.pitchPosition.distanceTo(opp.pitchPosition) } ?: 50f
                    val score = (laneClearance * 0.55f) + ((mate.pitchPosition.x - ball.pitchPosition.x) * 0.30f)
                    PassOption(target = mate, score = score, laneClearance = laneClearance, rank = index + 1)
                }.sortedByDescending { it.score }
            }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/efootball/visionassist/vision/VisionPipeline.kt
        package com.efootball.visionassist.vision
        import android.graphics.Bitmap
        import android.graphics.Color
        import com.efootball.visionassist.data.*
        import com.efootball.visionassist.engine.PassEngine
        import kotlinx.coroutines.flow.MutableStateFlow
        import kotlin.math.abs

        object VisionPipeline {
            val overlayState = MutableStateFlow(OverlayState())
            val statusText = MutableStateFlow("Color Engine Ready")
            
            fun init() { statusText.value = "Color Engine Ready" }
            
            fun processFrame(bitmap: Bitmap) {
                // Downscale for performance
                val scaled = Bitmap.createScaledBitmap(bitmap, bitmap.width / 4, bitmap.height / 4, false)
                val width = scaled.width
                val height = scaled.height
                val pixels = IntArray(width * height)
                scaled.getPixels(pixels, 0, width, 0, 0, width, height)

                var ball: DetectedBall? = null
                val players = mutableListOf<DetectedPlayer>()

                // Simple color scanning (scan every 4th pixel for speed)
                for (y in 0 until height step 4) {
                    for (x in 0 until width step 4) {
                        val p = pixels[y * width + x]
                        val r = Color.red(p)
                        val g = Color.green(p)
                        val b = Color.blue(p)

                        // 1. Ball Detection (White/Bright)
                        if (r > 200 && g > 200 && b > 200 && ball == null) {
                            // Scale back up coordinates
                            ball = DetectedBall(ScreenPoint(x * 4f, y * 4f), PitchPoint(x.toFloat(), y.toFloat()))
                        }
                        
                        // 2. Player Detection (Not green, not white, not black)
                        // If it's a strong color (like Red or Blue)
                        if ((r > 150 && g < 100 && b < 100) || (b > 150 && r < 100 && g < 100)) {
                            // Avoid adding too many players by checking distance
                            val pt = ScreenPoint(x * 4f, y * 4f)
                            if (players.none { abs(it.screenPosition.x - pt.x) < 50 && abs(it.screenPosition.y - pt.y) < 50 }) {
                                players.add(DetectedPlayer(pt, PitchPoint(x.toFloat(), y.toFloat()), PlayerRole.TEAMMATE, players.size))
                            }
                        }
                    }
                }

                if (ball != null && players.isNotEmpty()) {
                    val best = PassEngine.rankPasses(ball, players, emptyList()).firstOrNull()
                    overlayState.value = OverlayState(ball, players, best)
                    statusText.value = "Found! Players: ${players.size}"
                } else {
                    overlayState.value = OverlayState(ball, players)
                    statusText.value = "Searching... Ball: ${ball != null}, Players: ${players.size}"
                }
            }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/efootball/visionassist/overlay/PitchOverlayView.kt
        package com.efootball.visionassist.overlay
        import android.content.Context
        import android.graphics.*
        import android.view.View
        import com.efootball.visionassist.vision.VisionPipeline
        class PitchOverlayView(context: Context) : View(context) {
            private val ballPaint = Paint().apply { color = Color.CYAN; style = Paint.Style.FILL }
            private val teamPaint = Paint().apply { color = Color.BLUE; style = Paint.Style.STROKE; strokeWidth = 6f }
            private val passPaint = Paint().apply { color = Color.GREEN; strokeWidth = 10f; style = Paint.Style.STROKE }
            private val textPaint = Paint().apply { color = Color.YELLOW; textSize = 60f; isAntiAlias = true }
            
            private val handler = android.os.Handler(android.os.Looper.getMainLooper())
            private val runnable = object : Runnable { override fun run() { invalidate(); handler.postDelayed(this, 16) } }
            init { handler.post(runnable) }
            
            override fun onDraw(canvas: Canvas) {
                super.onDraw(canvas)
                
                canvas.drawText(VisionPipeline.statusText.value, 100f, 150f, textPaint)
                
                val state = VisionPipeline.overlayState.value
                state.ball?.let { canvas.drawCircle(it.screenPosition.x, it.screenPosition.y, 30f, ballPaint) }
                for (p in state.players) canvas.drawCircle(p.screenPosition.x, p.screenPosition.y, 50f, teamPaint)
                state.bestPass?.let { best -> state.ball?.let { b -> canvas.drawLine(b.screenPosition.x, b.screenPosition.y, best.target.screenPosition.x, best.target.screenPosition.y, passPaint) } }
            }
        }
        EOF

        echo '<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24.0" android:viewportHeight="24.0"><path android:fillColor="#FF000000" android:pathData="M12,4.5C7,4.5 2.73,7.61 1,12c1.73,4.39 6,7.5 11,7.5s9.27,-3.11 11,-7.5c-1.73,-4.39 -6,-7.5 -11,-7.5zM12,17c-2.76,0 -5,-2.24 -5,-5s2.24,-5 5,-5 5,2.24 5,5 -2.24,5 -5,5zM12,9c-1.66,0 -3,1.34 -3,3s1.34,3 3,3 3,-1.34 3,-3 -1.34,-3 -3,-3z"/></vector>' > app/src/main/res/drawable/ic_vision_hud.xml

        gradle assembleDebug
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: eFootball-Assist-APK
        path: "**/app/build/outputs/apk/debug/app-debug.apk"
