name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Unzip Project
      run: unzip eFootball-Vision-Assist-Android.zip -d app_source
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Build Debug APK
      run: |
        # كيقلب على فين كاين gradlew أوتوماتيكياً
        GRADLEW_PATH=$(find app_source -name gradlew -type f | head -n 1)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "Error: gradlew not found!"
          exit 1
        fi
        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        echo "Found project at: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        chmod +x gradlew
        ./gradlew assembleDebug
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: eFootball-Assist-APK
        path: "**/app/build/outputs/apk/debug/app-debug.apk"
