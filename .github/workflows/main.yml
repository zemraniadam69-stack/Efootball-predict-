name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Unzip Project
      run: unzip eFootball-Vision-Assist-Android.zip -d app_source
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Build Debug APK
      run: |
        # كيقلب على المجلد اللي فيه settings.gradle
        DIR=$(find app_source -name "settings.gradle*" -printf '%h\n' | head -n 1)
        if [ -z "$DIR" ]; then
          echo "Error: settings.gradle not found! Here is the file structure:"
          ls -R app_source
          exit 1
        fi
        echo "Project root found at: $DIR"
        cd "$DIR"
        
        # إلا لقى gradlew كيستعملو، إلا ما لقاهش كيستعمل النظام
        if [ -f "gradlew" ]; then
          echo "Using gradlew..."
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          echo "gradlew not found, using system gradle..."
          gradle assembleDebug
        fi
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/app/build/outputs/apk/debug/app-debug.apk"
